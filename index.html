<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários de Alimentação - 3 em 3 Horas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 26px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 16px;
        }

        input[type="time"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="time"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-apagar {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-apagar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(238, 90, 111, 0.4);
        }

        .btn-apagar:active {
            transform: translateY(0);
        }

        .salvo-aviso {
            display: none;
            text-align: center;
            font-size: 12px;
            color: #27ae60;
            background: #e8f8f0;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .salvo-aviso.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .resultado {
            display: none;
            margin-top: 15px;
        }

        .resultado.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resultado-titulo {
            color: #555;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .lista-horarios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .horario-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .horario-item:hover {
            transform: translateY(-3px);
        }

        .horario-item .numero {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.85;
            display: block;
            margin-bottom: 3px;
        }

        .horario-item.dia-seguinte {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .horario-item.dia-seguinte::after {
            content: '+1 dia';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: normal;
        }

        .vazio {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .lista-horarios {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .horario-item {
                font-size: 17px;
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Horários de Alimentação</h1>
        <p class="subtitle">Digite o primeiro horário e veja todos de 3 em 3 horas</p>

        <div class="salvo-aviso" id="salvoAviso">✅ Última atualização salva</div>

        <div class="input-group">
            <label for="horaInicial">Primeira Alimentação:</label>
            <input type="time" id="horaInicial">
        </div>

        <div class="botoes">
            <button class="btn-apagar" onclick="apagarTudo()">
                🗑️ Apagar
            </button>
        </div>

        <div class="error" id="errorMsg">Por favor, selecione um horário válido.</div>

        <div class="resultado" id="resultado">
            <div class="resultado-titulo">📋 Horários do dia (de 3 em 3 horas):</div>
            <div class="lista-horarios" id="listaHorarios"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'horarios_alimentacao_v1';

        const inputHora = document.getElementById('horaInicial');
        const resultadoDiv = document.getElementById('resultado');
        const listaHorarios = document.getElementById('listaHorarios');
        const errorMsg = document.getElementById('errorMsg');
        const salvoAviso = document.getElementById('salvoAviso');

        // ===== Carrega valor salvo ao abrir =====
        window.addEventListener('DOMContentLoaded', () => {
            const salvo = localStorage.getItem(STORAGE_KEY);
            if (salvo) {
                inputHora.value = salvo;
                calcularHorarios();
                mostrarAvisoSalvo();
            }
        });

        // ===== Eventos =====
        inputHora.addEventListener('input', () => {
            calcularHorarios();
            salvarHorario();
        });

        inputHora.addEventListener('change', () => {
            calcularHorarios();
            salvarHorario();
        });

        // ===== Salvar no localStorage =====
        function salvarHorario() {
            if (inputHora.value) {
                localStorage.setItem(STORAGE_KEY, inputHora.value);
                mostrarAvisoSalvo();
            }
        }

        let timeoutAviso;
        function mostrarAvisoSalvo() {
            salvoAviso.classList.add('show');
            clearTimeout(timeoutAviso);
            timeoutAviso = setTimeout(() => {
                salvoAviso.classList.remove('show');
            }, 2000);
        }

        // ===== Apagar tudo =====
        function apagarTudo() {
            const confirmar = confirm('Deseja apagar o horário salvo?');
            if (!confirmar) return;

            localStorage.removeItem(STORAGE_KEY);
            inputHora.value = '';
            resultadoDiv.classList.remove('show');
            errorMsg.classList.remove('show');
            listaHorarios.innerHTML = '';

            // Feedback visual
            salvoAviso.textContent = '🗑️ Dados apagados';
            salvoAviso.style.background = '#fde8e8';
            salvoAviso.style.color = '#e74c3c';
            salvoAviso.classList.add('show');

            clearTimeout(timeoutAviso);
            timeoutAviso = setTimeout(() => {
                salvoAviso.classList.remove('show');
                // Restaura aparência original
                setTimeout(() => {
                    salvoAviso.textContent = '✅ Última atualização salva';
                    salvoAviso.style.background = '#e8f8f0';
                    salvoAviso.style.color = '#27ae60';
                }, 300);
            }, 2000);
        }

        // ===== Cálculo dos horários =====
        function calcularHorarios() {
            const valor = inputHora.value;

            if (!valor) {
                resultadoDiv.classList.remove('show');
                errorMsg.classList.remove('show');
                return;
            }

            errorMsg.classList.remove('show');

            const [horas, minutos] = valor.split(':').map(Number);

            const dataBase = new Date();
            dataBase.setHours(horas);
            dataBase.setMinutes(minutos);
            dataBase.setSeconds(0);
            dataBase.setMilliseconds(0);

            const horarios = [];
            let contador = 0;

            while (contador < 8) {
                const novaData = new Date(dataBase.getTime());
                novaData.setHours(novaData.getHours() + (contador * 3));

                const diferencaHoras = (novaData - dataBase) / (1000 * 60 * 60);
                if (diferencaHoras >= 24) break;

                const hh = String(novaData.getHours()).padStart(2, '0');
                const mm = String(novaData.getMinutes()).padStart(2, '0');

                const passouMeiaNoite = (horas + contador * 3) >= 24;

                horarios.push({
                    hora: `${hh}:${mm}`,
                    diaSeguinte: passouMeiaNoite
                });

                contador++;
            }

            renderizarHorarios(horarios);
            resultadoDiv.classList.add('show');
        }

        function renderizarHorarios(horarios) {
            listaHorarios.innerHTML = '';

            if (horarios.length === 0) {
                listaHorarios.innerHTML = '<div class="vazio">Nenhum horário disponível</div>';
                return;
            }

            horarios.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'horario-item' + (item.diaSeguinte ? ' dia-seguinte' : '');
                div.innerHTML = `
                    <span class="numero">${index + 1}ª</span>
                    ${item.hora}
                `;
                listaHorarios.appendChild(div);
            });
        }
    </script>
</body>
</html>
